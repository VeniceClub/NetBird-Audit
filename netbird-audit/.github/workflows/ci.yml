name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Go format
        run: test -z "$(gofmt -l cmd internal)"
      - name: Modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || true
          go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Shell syntax
        run: |
          for f in *.sh scripts/*.sh; do [ -e "$f" ] && bash -n "$f"; done
      - name: Build binaries
        run: |
          go build ./cmd/audit-server
          go build ./cmd/audit-sensor
      - name: Compile eBPF object
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-libc-dev
          clang -O2 -g -target bpf -D__TARGET_ARCH_x86 -I/usr/include/x86_64-linux-gnu -c sensor/bpf/audit.bpf.c -o /tmp/audit.bpf.o
